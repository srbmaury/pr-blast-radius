spring:
  application:
    name: pr-blast-radius
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blast_radius}
    username: ${DATABASE_USER:blast_radius}
    password: ${DATABASE_PASSWORD:blast_radius}

metadata:
  datasource:
    url: ${METADATA_DATABASE_URL:jdbc:h2:file:./data/pr-blast-radius-metadata;AUTO_SERVER=TRUE}
    username: ${METADATA_DATABASE_USER:sa}
    password: ${METADATA_DATABASE_PASSWORD:}
    driver-class-name: ${METADATA_DATABASE_DRIVER:org.h2.Driver}
  retention-hours: ${METADATA_RETENTION_HOURS:168}
  trace-retention-hours: ${TRACE_RETENTION_HOURS:24}
  trace-max-root-spans: ${TRACE_MAX_ROOT_SPANS:1000}
  cleanup-interval-ms: ${METADATA_CLEANUP_INTERVAL_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

security:
  tenant-auth-enabled: ${TENANT_AUTH_ENABLED:false}
  admin-token: ${ADMIN_TOKEN:}
